# Lokaler Teststand (Docker Desktop) — Compose-Projekt "pokecollect-test".
# Zweck: Browser-Verifikation vor jedem Release, ohne Prod-Runden.
#   Start:  sh scripts/teststand.sh up
#   Seed:   sh scripts/teststand.sh seed
#   Stop:   sh scripts/teststand.sh down   (reset = down + Volumes löschen)
# Web http://localhost:3021 · API http://localhost:3020 · Postgres nur intern.
# Testdaten/Test-Secrets — bewusst hart verdrahtet, hier liegt nichts Echtes.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokecollect
      POSTGRES_PASSWORD: pokecollect
      POSTGRES_DB: pokecollect
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokecollect"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "3020:8000"
    environment:
      - DATABASE_URL=postgresql://pokecollect:pokecollect@db:5432/pokecollect
      - JWT_SECRET=teststand-secret
      # Teststand-Web läuft auf 3021 → muss als Origin erlaubt sein.
      - CORS_ORIGINS=http://localhost:3021
      # Login: admin / teststand (bcrypt-Hash; $ wegen Compose-Interpolation
      # als $$ escaped). Start-Guard verlangt ein Passwort (Issue #1).
      - APP_PASSWORD_HASH=$$2b$$12$$DeEohIVnaJLbl/RfAGZYjONLbnSdt4h0PByR61DSe87ZU3tmaJb9G
      # Gemini-Scan (#33-Verifikation): Key/Modell werden aus der HOST-Umgebung
      # durchgereicht — KEIN Secret im Repo. Zum Aktivieren vor `teststand.sh up`:
      #   export GEMINI_API_KEY="…"   (optional: export GEMINI_MODEL="…")
      # Ohne gesetzten Key bleibt der Scan beim lokalen OCR-Fallback.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - images-test:/app/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3020
    ports:
      - "3021:3000"
    # #98 Panel-Nacharbeit: HARTE Obergrenze für den next/image-Cache.
    # Next 14 räumt diesen Cache NIE auf — kein LRU, keine Größengrenze,
    # nur eine Max-Age im Dateinamen (31536000 = ein Jahr). Ohne Deckel kann
    # jeder, der die Instanz erreicht, unbegrenzt Plattenplatz belegen; auf
    # einem geteilten Server trifft eine volle Platte auch fremde Dienste.
    # tmpfs statt Volume, weil der Cache ohnehin flüchtig ist (jeder Deploy
    # verliert ihn) und RAM sich hart deckeln lässt: gemessen 20 MB in ein
    # 8-MB-tmpfs geschrieben → exakt 8 MB belegt, Platte unberührt.
    # uid/gid 3010 = der Nutzer pokecollect aus web/Dockerfile; mode 0700
    # statt des tmpfs-Standards 1777 (weltschreibbar).
    tmpfs:
      - /app/.next/cache/images:size=256m,uid=3010,gid=3010,mode=0700
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata-test:
  images-test:
