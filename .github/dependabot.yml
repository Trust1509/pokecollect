# Dependabot (CI-Härtung, Best-Practice-Abgleich 2026-08, Owner-Freigabe E1).
# Die EINZIGE tolerierte Bot-PR-Quelle im sonst PR-losen Trunk-Workflow —
# Merge nur nach grünen Gates auf dem PR.
#
# WICHTIG, Merge-Ritual:
# * npm-PRs: package-lock.json wird NUR im Node-Container erzeugen/geprüft
#   (CLAUDE.md „Kein Node/npm lokal auf diesem PC" — der lokale npm-Wrapper
#   schreibt inkompatible Locks). Nach dem Merge zur Sicherheit einmal
#   `docker run --rm -v "$PWD/web":/w -w /w node:20-alpine npm install
#   --package-lock-only` laufen lassen, bevor der nächste Release-Build läuft.
#   Deshalb npm nur MONATLICH und gruppiert — wenig PRs, ein Ritual-Lauf.
# * pip-PRs: kein Lock-Mechanismus (backend/requirements.txt ist die einzige
#   Quelle) — direkt mergen, `scripts/gates.sh` prüft den echten Installations-
#   pfad gegen Postgres.
# ══ NOTBREMSE bis 01.09.2026 (Owner-Entscheidung 14.08.) ═══════════════════
# Portfolio-Kontingent: 2701 von 3000 Minuten verbraucht, 299 für 18 Tage.
# Versions-PRs sind der größte einzelne Posten — nicht der PR selbst, sondern
# das Nachziehen: Dependabot rebaset jeden offenen PR, wenn main sich bewegt,
# und jeder Rebase löst einen weiteren Lauf aus. Bei neun offenen PRs und acht
# Pushes an einem Tag multipliziert sich das.
#
# `open-pull-requests-limit: 0` legt VERSIONS-Updates still.
# SICHERHEITS-Updates laufen davon unberührt weiter — die bleiben an.
#
# ⚠️ AM 01.09. ZURÜCKSETZEN: github-actions weekly/limit 5,
#    pip weekly/limit 5, npm monthly/limit 3 — und die am 14.08. geschlossenen
#    PRs #49-#51, #57-#62 kommen dann von selbst wieder.
# ═══════════════════════════════════════════════════════════════════════════
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # SHA-gepinnte Actions: Dependabot aktualisiert Pin UND Versions-Kommentar.
    open-pull-requests-limit: 0
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      npm-monatlich:
        patterns: ["*"]
    open-pull-requests-limit: 0
