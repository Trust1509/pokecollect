# Dependabot (CI-Härtung, Best-Practice-Abgleich 2026-08, Owner-Freigabe E1).
# Die EINZIGE tolerierte Bot-PR-Quelle im sonst PR-losen Trunk-Workflow —
# Merge nur nach grünen Gates auf dem PR.
#
# WICHTIG, Merge-Ritual:
# * npm-PRs: package-lock.json wird NUR im Node-Container erzeugen/geprüft
#   (CLAUDE.md „Kein Node/npm lokal auf diesem PC" — der lokale npm-Wrapper
#   schreibt inkompatible Locks). Nach dem Merge zur Sicherheit einmal
#   `docker run --rm -v "$PWD/web":/w -w /w node:20-alpine npm install
#   --package-lock-only` laufen lassen, bevor der nächste Release-Build läuft.
#   Deshalb npm nur MONATLICH und gruppiert — wenig PRs, ein Ritual-Lauf.
# * pip-PRs: kein Lock-Mechanismus (backend/requirements.txt ist die einzige
#   Quelle) — direkt mergen, `scripts/gates.sh` prüft den echten Installations-
#   pfad gegen Postgres.
# ══ DAUERREGEL (Owner, 02.09.2026 — ersetzt die Notbremse vom 14.08.) ═══════
# Versions-Updates laufen wieder, aber gedrosselt: `interval` bleibt MONTHLY,
# `open-pull-requests-limit: 1` je Ökosystem. Hintergrund: Dependabot rebaset
# jeden offenen PR bei jeder Bewegung von main und löst je Rebase einen
# CI-Lauf aus — weekly/limit 5 war eine der beiden Ursachen des
# Kontingent-Platzers (2701/3000 Min am 14.08.). Das Portfolio-Tagesbudget
# über alle Repos ist 100 Min; ein Lauf hier kostet 2–4 Min.
# SICHERHEITS-Updates laufen davon unberührt weiter.
# Die am 14.08. geschlossenen Versions-PRs (#49-#51, #57-#62) kommen mit
# Limit 1 EINZELN nacheinander wieder — Merge nur nach grünen Gates am PR.
# NICHT auf weekly/limit 5 zurückdrehen — die frühere Rücksetz-Notiz hier war
# in die falsche Richtung geschrieben.
# ═══════════════════════════════════════════════════════════════════════════
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # SHA-gepinnte Actions: Dependabot aktualisiert Pin UND Versions-Kommentar.
    open-pull-requests-limit: 1
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      npm-monatlich:
        patterns: ["*"]
    # Generationssprung des Frontend-Stacks (Next 16 / React 19 / Tailwind 4 / TS 7)
    # ist Owner-Entscheid (#87) und wird bewusst geplant, nicht per Sammel-PR gemergt:
    # Major-Updates dieser Pakete ignorieren; Minor/Patch laufen weiter. ACHTUNG
    # (Panel-Fund): `ignore` gilt laut Dependabot-Referenz AUCH für Sicherheits-
    # Updates — ein Fix, der nur in einer neuen Hauptversion existiert (Stand
    # 09/2026: 21 Next-Advisories, Fix erst in 15.5.21/16.x), kommt NICHT als PR.
    # Das ist hier bewusst so: der Sprung wird geplant (#87), nicht per PR gemergt;
    # der Detektor für solche Major-only-Fixes ist der Montags-Lauf
    # `npm audit --audit-level=high` in security-scan.yml (nicht-blockierend,
    # Funde triagieren). Minor/Patch-Sicherheitsfixes kommen weiterhin als PR.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 1
