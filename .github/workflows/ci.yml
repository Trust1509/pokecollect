# CI-Gates: laufen bei jedem Push auf main (und auf PRs, falls doch mal einer kommt).
# Spiegelt scripts/gates.sh — Backend-pytest gegen echtes Postgres, Web tsc + build.
name: CI

# CI-Härtung (Best-Practice-Abgleich 2026-08, E1): Least Privilege — die Gates
# lesen nur den Code, nichts schreibt zurück.
permissions:
  contents: read

# CI-Minuten-Diät (2026-08-06): bei schnell aufeinanderfolgenden main-Pushes
# (Bauwellen) überholte Läufe abbrechen — der neueste Lauf prüft den kumulierten
# Stand; die Per-Commit-Prüfung leisten weiterhin die lokalen Gates VOR dem Push.
# LEITPLANKE 1: group trägt den Ref → Tags bekommen eine EIGENE Gruppe, und
# cancel-in-progress ist für Tag-Refs AUS — ein Release-Build darf nie von einem
# Folge-Push abgebrochen werden. (ci.yml triggert heute nicht auf Tags; der
# Schutz steht defensiv, falls je ein Tag-Trigger dazukommt.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

on:
  push:
    branches: [main]
    # CI-Minuten-Diät: reine Doku triggert keinen Lauf — kein Job konsumiert sie
    # (Backend-pytest + Web-tsc/build lesen nur Code). NICHT ignoriert:
    # web/src/lib/version.ts/releaseNotes (ist Code) und docs/** (könnte mit
    # einer künftigen Wissensbasis Produkt-Content werden — Leitplanke 3).
    # Mischcommits (Doku + Code) triggern weiter, da paths-ignore nur greift,
    # wenn AUSSCHLIESSLICH ignorierte Pfade geändert wurden.
    paths-ignore:
      - '*.md'
      - '.github/**/*.md'
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokecollect
          POSTGRES_PASSWORD: pokecollect
          POSTGRES_DB: pokecollect_test
        ports:
          - "5440:5432"
        options: >-
          --health-cmd "pg_isready -U pokecollect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-gepinnt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (SHA-gepinnt)
        with:
          python-version: "3.12"
          # CI-Minuten-Diät (Maßnahme 2): pip-Download-Cache, Key = Hash der
          # requirements*.txt (built-in der setup-Action). LEITPLANKE 2 ist hier
          # gegenstandslos — PokéCollect hat keinen Ist-Mengen-Wächter/
          # requirements.lock (installiert direkt aus requirements.txt).
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          DATABASE_URL: postgresql://pokecollect:pokecollect@localhost:5440/pokecollect_test
          JWT_SECRET: ci-secret
          # bcrypt("teststand") — Start-Guard verlangt ein Passwort (Issue #1);
          # conftest.py überschreibt den Wert ohnehin deterministisch.
          APP_PASSWORD_HASH: '$2b$12$DeEohIVnaJLbl/RfAGZYjONLbnSdt4h0PByR61DSe87ZU3tmaJb9G'
          IMAGES_DIR: /tmp/ci-images
        run: |
          mkdir -p /tmp/ci-images
          python -m pytest tests -q

  web:
    name: Web (tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-gepinnt)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4 (SHA-gepinnt)
        with:
          node-version: 20
          # CI-Minuten-Diät (Maßnahme 2): npm-Cache (~/.npm), Key = Hash der
          # package-lock.json (built-in). npm ci installiert weiterhin frisch aus
          # dem Lock — nur der Download entfällt bei Cache-Hit.
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3010
        run: npm run build
